<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>報修登記</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="page"><h1>報修登記</h1></div>
  </header>
  <main class="page">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <p class="muted">清單公開可見，請使用示範姓名和地點，並避免填寫敏感資訊。</p>
      <form id="repair-form">
        <label>報修人
          <input name="reporter_name" placeholder="例如：測試員甲" maxlength="100" required>
        </label>
        <label>地點或部門
          <input name="location" placeholder="例如：示範辦公室" maxlength="200" required>
        </label>
        <label>類別
          <select name="category" required>
            <option value="">請選擇類別</option>
            <option>設備</option>
            <option>網路</option>
            <option>環境</option>
            <option>其他</option>
          </select>
        </label>
        <label>緊急程度
          <select name="urgency" required>
            <option>低</option>
            <option selected>中</option>
            <option>高</option>
          </select>
        </label>
        <label class="wide">問題說明
          <textarea name="description" rows="4" maxlength="2000" placeholder="請描述發生的問題" required></textarea>
        </label>
        <div class="wide actions">
          <button id="submit-repair" type="submit" disabled>送出報修</button>
          <p id="form-message" role="status"></p>
        </div>
      </form>
      <noscript><p>請啟用 JavaScript 以使用報修表單與清單。</p></noscript>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <div class="section-heading">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button class="secondary" id="refresh-list" type="button" disabled>重新整理</button>
      </div>
      <p id="list-message" role="status">正在載入清單…</p>
      <ul id="repair-list" class="repair-list" aria-label="報修清單"></ul>
    </section>
  </main>
</body>
</html>
